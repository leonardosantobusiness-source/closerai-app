<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CloserAI - Treinar IA</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

<div class="logo">

Closer<span>AI</span>

</div>

<nav class="nav-links">

<a href="dashboard.html">Dashboard</a>

<a href="agente.html">Minha IA</a>

<a href="login.html">Sair</a>

</nav>

</header>

<main class="container">

<section class="agent-header">

<h1 class="title">

Crie seu <span>Vendedor IA</span>

</h1>

<p class="description">

Ensine o CloserAI sobre sua empresa para que ele consiga conversar, vender e atender clientes automaticamente.

</p>

</section>

<form id="agenteForm">

<div class="card">

<h2>🤖 Perfil da IA</h2>

<label>Nome da IA</label>

<input
id="nomeIA"
type="text"
placeholder="Ex: Alex, Sofia, Closer"
required
>

<label>Personalidade</label>

<select id="personalidade">

<option>Profissional</option>

<option>Amigável</option>

<option>Consultor de vendas</option>

</select>

</div>

<div class="card">

<h2>🏢 Sobre a Empresa</h2>

<label>Área do negócio</label>

<select id="categoria">

<option>E-commerce</option>

<option>Educação</option>

<option>Serviços</option>

<option>Tecnologia</option>

<option>Outro</option>

</select>

<label>Descrição da empresa</label>

<textarea

id="descricao"

placeholder="Explique detalhadamente o que a empresa vende, para quem vende e como funciona."

></textarea>

</div>

<div class="card">

<h2>📦 Produtos</h2>

<label>Produtos e serviços</label>

<textarea

id="produtos"

placeholder="Liste todos os produtos ou serviços."

></textarea>

<label>Moeda</label>

<select id="moeda">

<option>USD</option>

<option>EUR</option>

<option>GBP</option>

</select>

</div>

<div class="card">

<h2>🧠 Conhecimento</h2>

<label>Website</label>

<input

id="site"

type="url"

placeholder="https://empresa.com"

>

<label>Perguntas Frequentes</label>

<textarea

id="perguntas"

placeholder="Perguntas e respostas dos clientes."

></textarea></div>

<div class="card">

<h2>🎯 Objetivo da IA</h2>

<select id="objetivo">

<option>Vender produtos</option>

<option>Marcar reuniões</option>

<option>Fazer orçamentos</option>

<option>Captar clientes</option>

</select>

</div>

<div class="card">

<h2>🌍 Canais conectados</h2>

<div class="channels-select">

<label>

<input
id="canalWhatsapp"
type="checkbox">

WhatsApp

</label>

<label>

<input
id="canalTelegram"
type="checkbox">

Telegram

</label>

<label>

<input
id="canalInstagram"
type="checkbox">

Instagram

</label>

<label>

<input
id="canalWebsite"
type="checkbox">

Website

</label>

</div>

</div>

<p id="mensagemIA" class="description"></p>

<button

type="submit"

class="btn-primary train-btn">

🚀 Treinar minha IA

</button>

</form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/agente.js"></script>

</body>

</html>
