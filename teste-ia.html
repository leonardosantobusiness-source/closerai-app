<main class="dashboard-main">

<header class="dash-header">

<div>

<h1>

🧪 Teste do Vendedor IA

</h1>

<p>

Converse com a sua IA antes de ligar ao WhatsApp, Telegram ou Website.

</p>

</div>

<div class="ia-status">

🟢 IA Online

</div>

</header>

<div class="dash-box">

<h2>

Chat de Teste

</h2>

<div

id="chat"

style="height:420px;
overflow-y:auto;
margin-top:20px;
padding:20px;
border-radius:15px;
background:#07101f;">

<div class="message ia">

Olá!

Sou o seu vendedor IA.

Como posso ajudar?

</div></div>

<div style="margin-top:20px;">

<label>

Escreva uma mensagem

</label>

<textarea

id="mensagem"

placeholder="Ex: Olá, quanto custa o plano Premium?"

style="width:100%;
height:120px;
margin-top:10px;
padding:15px;
border-radius:12px;
background:#020617;
color:white;
border:1px solid #1e40af;
resize:none;"

></textarea>

<div style="display:flex;gap:15px;margin-top:20px;">

<button

id="btnEnviar"

class="btn-primary"

type="button">

📨 Enviar

</button>

<button

id="btnLimpar"

class="btn-outline"

type="button">

🗑️ Limpar conversa

</button>

</div>

<p

id="status"

class="description"

style="margin-top:15px;">

A IA está pronta para responder.

</p>

</div>

</div></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/teste-ia.js"></script>

</body>

</html>
