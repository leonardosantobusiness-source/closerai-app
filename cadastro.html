<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CloserAI - Criar Conta</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-page">

<div class="card auth-card glow">

<div class="logo auth-logo">
Closer<span>AI</span>
</div>

<h1>Crie sua conta</h1>

<p class="description">
Comece a criar o seu vendedor IA que trabalha 24 horas.
</p>

<form id="cadastroForm">

<label>Nome da empresa</label>

<input
id="empresa"
type="text"
placeholder="Ex: Minha Empresa"
required
>

<label>Nome do responsável</label>

<input
id="nome"
type="text"
placeholder="Seu nome"
required
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Digite seu email"
required
>

<label>Senha</label>

<input
id="senha"
type="password"
placeholder="Crie uma senha"
required
>

<button class="btn-primary" type="submit">

Criar conta grátis

</button>

</form>

<p id="mensagem" style="margin-top:20px;"></p>

<p class="bottom-text">

Já tem uma conta?

<a href="login.html">

Entrar

</a>

</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/cadastro.js"></script>

</body>

</html>
